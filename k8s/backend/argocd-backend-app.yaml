apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
name: backend
namespace: argocd

spec:
project: default

source:
repoURL: https://github.com/Vidyasagar18snc/New-Version-Ai-Recruiteer.git
targetRevision: backend-deploy
path: k8s/backend/backend-chart


helm:
  values: |
    image:
      repository: shiva9828/ai-recruiter-backend
      tag: "v1"
      pullPolicy: Always

    replicaCount: 2

    cors_origin: "https://qtgem.com,https://www.qtgem.com,http://localhost:3000"

    mongodb:
      uriSecretName: mongo-secret
      uriSecretKey: mongo-uri

    jwtSecret:
      secretName: app-secrets
      secretKey: jwt-secret


destination:
server: https://kubernetes.default.svc
namespace: backend

syncPolicy:
automated:
prune: true
selfHeal: true

syncOptions:
  - CreateNamespace=true


