apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Release.Namespace }}

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:

        - containerPort: {{ .Values.service.port }}


        env:

        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secret.mongoSecrets.uriSecretName }}
              key: {{ .Values.secret.mongoSecrets.uriSecretKey }}


        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret


        - name: CORS_ORIGIN
          value: "{{ .Values.env.corsOrigin }}"


        livenessProbe:

          httpGet:
            path: /healthz
            port: {{ .Values.service.port }}

          initialDelaySeconds: 15
          periodSeconds: 10


        readinessProbe:

          httpGet:
            path: /healthz
            port: {{ .Values.service.port }}

          initialDelaySeconds: 5
          periodSeconds: 5